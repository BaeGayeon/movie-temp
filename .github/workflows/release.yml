# v0.2.0 같은 태그를 푸시하면 GitHub Release 를 만든다.
#  - 태그와 버전 파일들(manifest/서버)이 같은지, CHANGELOG 항목이 있는지 확인하고
#  - 서버 테스트를 돌린 뒤
#  - 저장소 변수 STORE_SERVER_URL(예: wss://내서버.onrender.com)이 있으면 스토어용 zip 을 만들어 Release 에 붙인다.
# 절차는 docs/release.md.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 태그/버전/CHANGELOG 점검
        run: node tools/check-release.mjs "$GITHUB_REF_NAME"
      - name: 서버 테스트
        working-directory: server
        run: |
          npm ci
          npm test
      - name: 스토어용 zip 만들기
        env:
          STORE_SERVER_URL: ${{ vars.STORE_SERVER_URL }}
        run: |
          if [ -z "$STORE_SERVER_URL" ]; then
            echo "::warning::저장소 변수 STORE_SERVER_URL 이 없어 zip 없이 릴리스를 만들어요 (Settings → Secrets and variables → Actions → Variables)"
          else
            node tools/build-store.mjs --server "$STORE_SERVER_URL"
          fi
      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            --verify-tag
