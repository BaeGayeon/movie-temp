<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>내 컴퓨터 글꼴 불러오기</title>
  <link rel="stylesheet" href="../popup/popup.css">
  <style>body { max-width: 420px; margin: 24px auto; padding: 0 16px; } .card { padding: 16px; display: flex; flex-direction: column; gap: 12px; } #sample { padding: 10px 12px; border-radius: 12px; background: var(--bg); font-size: 16px; }</style>
</head>
<body>
  <main>
    <section class="card">
      <h1 style="margin:0;font-size:18px">🔤 내 컴퓨터 글꼴 불러오기</h1>
      <button id="load" class="btn primary">💻 글꼴 목록 불러오기</button>
      <div class="hint" id="status"></div>
      <select id="select" hidden aria-label="채팅 글꼴"></select>
      <div id="sample" hidden>안녕하세요, 같이 봐요 ABC 123 ♥</div>
      <div class="error" id="error"></div>
    </section>
  </main>
  <script type="module" src="fonts.js"></script>
</body>
</html>
