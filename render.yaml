# Render Blueprint: 저장소에 이 파일이 있으면 Render 대시보드의 New > Blueprint 로 바로 만들 수 있다.
services:
  - type: web
    name: bae-movie-temp-server
    runtime: node
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js # npm 을 거치면 배포 때 보내는 종료 신호(SIGTERM)가 서버에 전달되지 않을 수 있어 직접 실행한다(재시작 알림에 필요)
    healthCheckPath: /health
    plan: free # 무료 플랜은 한동안 접속이 없으면 잠든다(다시 깨우는 데 30초 안팎). 같이 볼 때 쓴다면 starter 이상 권장
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Render 프록시가 붙인 X-Forwarded-For 로 접속자 IP 를 판별한다(IP 별 제한용). 프록시 없는 환경에서는 켜지 말 것
      # 서버 재시작(배포) 뒤 방 복구 토큰을 확인하는 서명 키. 처음 한 번 만들어지고 이후 배포에서도 같은 값을 쓴다
      - key: RESTORE_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      # 스토어에 올린 확장의 ID(32자)를 대시보드에서 넣으면 그 확장의 접속만 받는다. 비워 두면 아무 확장의 접속이나 받는다
      - key: EXTENSION_ID
        sync: false
